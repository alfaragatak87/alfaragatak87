<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Muhammad Alfatih, Mobile and Web Developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.6" stop-color="#0f2a4d"/>
      <stop offset="1" stop-color="#1e88e5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#64b5f6"/>
      <stop offset="1" stop-color="#2196f3"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#42a5f5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#42a5f5" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="round"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>
    <circle cx="1020" cy="70" r="200" fill="url(#glow)">
      <animate attributeName="cx" values="1020;960;1020" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="70;120;70" dur="9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="140" cy="260" r="160" fill="url(#glow)" opacity="0.6">
      <animate attributeName="cx" values="140;220;140" dur="11s" repeatCount="indefinite"/>
    </circle>
    <g font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
      <text x="600" y="140" text-anchor="middle" font-size="88" font-weight="700" fill="#ffffff" letter-spacing="1">Muhammad Alfatih</text>
      <rect x="530" y="166" width="140" height="6" rx="2" fill="url(#accent)"/>
      <text x="600" y="222" text-anchor="middle" font-size="38" fill="#bbdefb" letter-spacing="5">MOBILE &amp; WEB DEVELOPER</text>
      <text x="600" y="276" text-anchor="middle" font-size="28" fill="#90caf9" fill-opacity="0.85" letter-spacing="1">Informatics Student · ITB Widya Gama</text>
    </g>
  </g>
</svg>
